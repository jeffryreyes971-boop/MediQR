<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Vacunas')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/layout :: tabs(${perfil}, 'vacunas')}"></div>

  <div class="card mq-card mb-4"><div class="card-body">
    <h2 class="h5 mb-3"><i class="bi bi-shield-plus text-success"></i> Carné de vacunación</h2>
    <div class="table-responsive">
    <table class="table align-middle mb-0">
      <thead><tr><th>Vacuna</th><th>Aplicada</th><th>Próxima dosis</th><th></th></tr></thead>
      <tbody>
        <tr th:each="v : ${vacunas}">
          <td class="fw-semibold" th:text="${v.nombre}"></td>
          <td th:text="${#temporals.format(v.fechaAplicacion, 'dd/MM/yyyy')}"></td>
          <td><span th:if="${v.proximaDosis}" class="badge text-bg-info" th:text="${#temporals.format(v.proximaDosis, 'dd/MM/yyyy')}"></span>
              <span th:unless="${v.proximaDosis}" class="text-muted">—</span></td>
          <td class="text-end">
            <form th:action="@{/perfiles/{p}/vacunas/{id}/eliminar(p=${perfil.id},id=${v.id})}" method="post" data-confirm="¿Eliminar esta vacuna?">
              <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(vacunas)}"><td colspan="4" class="text-muted text-center py-4">Aún no hay vacunas registradas.</td></tr>
      </tbody>
    </table></div>
  </div></div>

  <div class="card mq-card"><div class="card-body">
    <h2 class="h6 text-uppercase text-muted">Registrar vacuna</h2>
    <form th:action="@{/perfiles/{p}/vacunas(p=${perfil.id})}" th:object="${nueva}" method="post" class="row g-2">
      <div class="col-md-4"><input class="form-control" th:field="*{nombre}" placeholder="Influenza" required></div>
      <div class="col-md-3"><label class="small text-muted">Fecha de aplicación</label><input type="date" class="form-control" th:field="*{fechaAplicacion}" required></div>
      <div class="col-md-3"><label class="small text-muted">Próxima dosis (opcional)</label><input type="date" class="form-control" th:field="*{proximaDosis}"></div>
      <div class="col-md-2 d-grid align-self-end"><button class="btn btn-mq">Guardar</button></div>
    </form>
  </div></div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
