<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body class="mq-auth">
<main class="container">
  <div class="mq-auth-card mx-auto text-center">
    <div class="display-3 text-warning"><i class="bi bi-exclamation-triangle"></i></div>
    <h1 class="h4 mt-2" th:text="${status == 403} ? 'No tienes acceso a esta página' : (${status == 404} ? 'Página no encontrada' : 'Algo salió mal')">Error</h1>
    <p class="text-muted" th:text="'Código ' + ${status}">Código</p>
    <a class="btn btn-mq" th:href="@{/dashboard}">Volver al inicio</a>
  </div>
</main>
</body>
</html>
