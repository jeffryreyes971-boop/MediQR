<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Alergias')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/layout :: tabs(${perfil}, 'alergias')}"></div>

  <div class="card mq-card mb-4"><div class="card-body">
    <h2 class="h5 mb-3"><i class="bi bi-exclamation-triangle text-warning"></i> Alergias registradas</h2>
    <div class="table-responsive">
    <table class="table align-middle mb-0">
      <thead><tr><th>Sustancia</th><th>Reacción</th><th>Gravedad</th><th></th></tr></thead>
      <tbody>
        <tr th:each="a : ${alergias}">
          <td class="fw-semibold" th:text="${a.sustancia}"></td>
          <td th:text="${a.reaccion}"></td>
          <td><span class="badge" th:classappend="${a.gravedad.name() == 'GRAVE'} ? 'text-bg-danger' : (${a.gravedad.name() == 'MEDIA'} ? 'text-bg-warning' : 'text-bg-secondary')"
                    th:text="${a.gravedad}"></span></td>
          <td class="text-end">
            <form th:action="@{/perfiles/{p}/alergias/{id}/eliminar(p=${perfil.id},id=${a.id})}" method="post" data-confirm="¿Eliminar esta alergia?">
              <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(alergias)}"><td colspan="4" class="text-muted text-center py-4">Aún no hay alergias registradas.</td></tr>
      </tbody>
    </table></div>
  </div></div>

  <div class="card mq-card"><div class="card-body">
    <h2 class="h6 text-uppercase text-muted">Agregar alergia</h2>
    <form th:action="@{/perfiles/{p}/alergias(p=${perfil.id})}" th:object="${nueva}" method="post" class="row g-2">
      <div class="col-md-4"><input class="form-control" th:field="*{sustancia}" placeholder="Penicilina" required></div>
      <div class="col-md-4"><input class="form-control" th:field="*{reaccion}" placeholder="Reacción (urticaria, ...)"></div>
      <div class="col-md-2"><select class="form-select" th:field="*{gravedad}">
        <option value="LEVE">Leve</option><option value="MEDIA">Media</option><option value="GRAVE">Grave</option></select></div>
      <div class="col-md-2 d-grid"><button class="btn btn-mq">Guardar</button></div>
    </form>
  </div></div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
