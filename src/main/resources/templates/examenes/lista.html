<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Exámenes')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/layout :: tabs(${perfil}, 'examenes')}"></div>

  <div class="row g-4">
    <div class="col-lg-6">
      <div class="card mq-card h-100"><div class="card-body">
        <h2 class="h5 mb-3"><i class="bi bi-clipboard2-pulse text-primary"></i> Exámenes</h2>
        <ul class="list-group list-group-flush mb-3">
          <li class="list-group-item px-0 d-flex justify-content-between align-items-start gap-2" th:each="x : ${examenes}">
            <span class="flex-grow-1"><strong th:text="${x.tipo}"></strong><br><span class="small text-muted" th:text="${x.notas}"></span></span>
            <span class="badge text-bg-light" th:text="${#temporals.format(x.fecha, 'dd/MM/yyyy')}"></span>
            <form th:action="@{/perfiles/{p}/examenes/{id}/eliminar(p=${perfil.id},id=${x.id})}" method="post" data-confirm="¿Eliminar este examen?">
              <button class="btn btn-sm btn-outline-danger py-0"><i class="bi bi-trash"></i></button>
            </form>
          </li>
          <li class="list-group-item px-0 text-muted" th:if="${#lists.isEmpty(examenes)}">Aún no hay exámenes registrados.</li>
        </ul>
        <form th:action="@{/perfiles/{p}/examenes(p=${perfil.id})}" th:object="${nuevo}" method="post" class="row g-2">
          <div class="col-12"><input class="form-control" th:field="*{tipo}" placeholder="Química sanguínea" required></div>
          <div class="col-md-6"><input type="date" class="form-control" th:field="*{fecha}" required></div>
          <div class="col-md-6"><input class="form-control" th:field="*{notas}" placeholder="Notas"></div>
          <div class="col-12 d-grid"><button class="btn btn-mq">Agregar examen</button></div>
        </form>
      </div></div>
    </div>

    <div class="col-lg-6">
      <div class="card mq-card h-100"><div class="card-body">
        <h2 class="h5 mb-3"><i class="bi bi-graph-up text-success"></i> Resultados de laboratorio</h2>
        <table class="table table-sm align-middle">
          <thead><tr><th>Valor</th><th>Resultado</th><th>Límite</th><th>Fecha</th><th></th></tr></thead>
          <tbody>
            <tr th:each="r : ${resultados}"
                th:classappend="${r.refMax != null and r.valor.compareTo(r.refMax) > 0} ? 'table-danger'">
              <td class="fw-semibold" th:text="${r.analito}"></td>
              <td><span th:text="${r.valor}"></span> <span th:text="${r.unidad}"></span></td>
              <td th:text="${r.refMax}"></td>
              <td th:text="${#temporals.format(r.fecha, 'dd/MM/yy')}"></td>
              <td class="text-end">
                <form th:action="@{/perfiles/{p}/examenes/resultados/{id}/eliminar(p=${perfil.id},id=${r.id})}" method="post" data-confirm="¿Eliminar este resultado?">
                  <button class="btn btn-sm btn-outline-danger py-0"><i class="bi bi-trash"></i></button>
                </form>
              </td>
            </tr>
            <tr th:if="${#lists.isEmpty(resultados)}"><td colspan="5" class="text-muted">Sin resultados.</td></tr>
          </tbody>
        </table>
        <p class="small text-muted">Las filas en rojo están por encima del límite normal.</p>
        <form th:action="@{/perfiles/{p}/examenes/resultados(p=${perfil.id})}" th:object="${nuevoResultado}" method="post" class="row g-2">
          <div class="col-md-6"><input class="form-control" th:field="*{analito}" placeholder="CREATININA" required></div>
          <div class="col-md-6"><input type="date" class="form-control" th:field="*{fecha}" required></div>
          <div class="col-4"><input type="number" step="0.01" class="form-control" th:field="*{valor}" placeholder="Valor" required></div>
          <div class="col-4"><input class="form-control" th:field="*{unidad}" placeholder="mg/dL"></div>
          <div class="col-4"><input type="number" step="0.01" class="form-control" th:field="*{refMax}" placeholder="Límite"></div>
          <div class="col-12 d-grid"><button class="btn btn-outline-primary">Agregar resultado</button></div>
        </form>
      </div></div>
    </div>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
