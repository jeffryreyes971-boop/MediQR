<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Accesos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/layout :: tabs(${perfil}, 'accesos')}"></div>

  <div class="card mq-card"><div class="card-body">
    <h2 class="h5 mb-1"><i class="bi bi-eye text-primary"></i> ¿Quién vio mi información?</h2>
    <p class="small text-muted">Cada vez que se abre un QR queda registrado aquí.</p>
    <ul class="mq-timeline">
      <li th:each="a : ${accesos}">
        <span class="mq-dot" th:classappend="${a.tipo == 'EMERGENCIA'} ? 'bg-danger' : 'bg-primary'"></span>
        <div class="fw-semibold" th:text="${a.tipo == 'EMERGENCIA'} ? 'Se abrió el QR de emergencia' : 'Un médico abrió el QR de consulta'"></div>
        <div class="small text-muted">
          <i class="bi bi-clock"></i> <span th:text="${#temporals.format(a.fecha, 'dd/MM/yyyy HH:mm')}"></span>
          · <i class="bi bi-hdd-network"></i> <span th:text="${a.ip}"></span>
        </div>
        <div class="small text-muted text-truncate" th:text="${a.userAgent}"></div>
      </li>
    </ul>
    <p class="text-muted text-center py-4 mb-0" th:if="${#lists.isEmpty(accesos)}">Nadie ha accedido todavía a tu información.</p>
  </div></div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
