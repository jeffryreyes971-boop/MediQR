<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Documentos')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/layout :: tabs(${perfil}, 'documentos')}"></div>

  <div class="alert alert-success" th:if="${ok}" th:text="${ok}"></div>
  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

  <div class="card mq-card mb-4"><div class="card-body">
    <h2 class="h5 mb-1"><i class="bi bi-file-earmark-lock text-primary"></i> Documentos médicos</h2>
    <p class="small text-muted">Se guardan cifrados. Solo tú puedes abrirlos.</p>
    <ul class="list-group list-group-flush">
      <li class="list-group-item px-0 d-flex align-items-center gap-3" th:each="d : ${documentos}">
        <i class="bi fs-3" th:classappend="${d.tipoMime == 'application/pdf'} ? 'bi-file-earmark-pdf text-danger' : 'bi-file-earmark-image text-success'"></i>
        <div class="flex-grow-1">
          <div class="fw-semibold" th:text="${d.nombreOriginal}"></div>
          <div class="small text-muted" th:text="${#temporals.format(d.creadoEn, 'dd/MM/yyyy HH:mm')}"></div>
        </div>
        <a class="btn btn-sm btn-outline-primary" th:href="@{/perfiles/{p}/documentos/{id}(p=${perfil.id},id=${d.id})}" target="_blank"><i class="bi bi-eye"></i> Ver</a>
        <form th:action="@{/perfiles/{p}/documentos/{id}/eliminar(p=${perfil.id},id=${d.id})}" method="post" data-confirm="¿Eliminar este documento? No se puede recuperar.">
          <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
        </form>
      </li>
      <li class="list-group-item px-0 text-muted text-center py-4" th:if="${#lists.isEmpty(documentos)}">Aún no hay documentos.</li>
    </ul>
  </div></div>

  <div class="card mq-card"><div class="card-body">
    <h2 class="h6 text-uppercase text-muted">Subir documento</h2>
    <form th:action="@{/perfiles/{p}/documentos(p=${perfil.id})}" method="post" enctype="multipart/form-data" class="row g-2">
      <div class="col-md-9"><input type="file" name="archivo" class="form-control" accept="image/*,application/pdf" required></div>
      <div class="col-md-3 d-grid"><button class="btn btn-mq"><i class="bi bi-upload"></i> Subir</button></div>
      <div class="form-text">Imágenes o PDF, máximo 5 MB.</div>
    </form>
  </div></div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
