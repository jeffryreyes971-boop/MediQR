<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Crear cuenta')}"></head>
<body class="mq-auth">
<main class="container">
  <div class="mq-auth-card mx-auto">
    <div class="text-center mb-4">
      <div class="mq-logo"><i class="bi bi-heart-pulse-fill"></i></div>
      <h1 class="h4 fw-bold mb-0">Crea tu cuenta</h1>
      <p class="text-muted small">Guarda tu historial y el de tu familia</p>
    </div>

    <form th:action="@{/registro}" th:object="${form}" method="post" novalidate>
      <div class="mb-3">
        <label class="form-label">Nombre completo</label>
        <input class="form-control" th:field="*{nombre}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{nombre}"></div>
      </div>
      <div class="mb-3">
        <label class="form-label">Correo</label>
        <input type="email" class="form-control" th:field="*{correo}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{correo}"></div>
      </div>
      <div class="mb-4">
        <label class="form-label">Contraseña <span class="text-muted small">(mínimo 8 caracteres)</span></label>
        <input type="password" class="form-control" th:field="*{password}" th:errorclass="is-invalid">
        <div class="invalid-feedback" th:errors="*{password}"></div>
      </div>
      <button class="btn btn-mq w-100 py-2">Crear cuenta</button>
    </form>
    <p class="text-center small mt-4 mb-0">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a></p>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
