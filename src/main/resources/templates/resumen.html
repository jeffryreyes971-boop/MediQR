<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Resumen con IA')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4" style="max-width: 820px">
  <div th:replace="~{fragments/layout :: tabs(${perfil}, 'inicio')}"></div>

  <div class="card mq-card"><div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="h5 mb-0"><i class="bi bi-stars text-warning"></i> Resumen para el doctor</h2>
      <button class="btn btn-outline-secondary btn-sm" onclick="window.print()"><i class="bi bi-printer"></i> Imprimir</button>
    </div>
    <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>
    <div class="mq-resumen" th:if="${resumen}" th:text="${resumen}">Texto del resumen...</div>
    <p class="small text-muted mt-3 mb-0"><i class="bi bi-robot"></i> Resumen generado por IA. No sustituye al criterio médico; verifica con los documentos originales.</p>
  </div></div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
