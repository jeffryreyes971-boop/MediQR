<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Enfermedades')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/layout :: tabs(${perfil}, 'enfermedades')}"></div>

  <div class="card mq-card mb-4"><div class="card-body">
    <h2 class="h5 mb-3"><i class="bi bi-activity text-danger"></i> Enfermedades y diagnósticos</h2>
    <div class="table-responsive">
    <table class="table align-middle mb-0">
      <thead><tr><th>Enfermedad</th><th>Desde</th><th>Tipo</th><th>Notas</th><th></th></tr></thead>
      <tbody>
        <tr th:each="e : ${enfermedades}">
          <td class="fw-semibold" th:text="${e.nombre}"></td>
          <td th:text="${e.desde != null} ? ${#temporals.format(e.desde, 'dd/MM/yyyy')} : '—'"></td>
          <td><span class="badge" th:classappend="${e.cronica} ? 'text-bg-warning' : 'text-bg-light'" th:text="${e.cronica} ? 'Crónica' : 'Pasajera'"></span></td>
          <td th:text="${e.notas}"></td>
          <td class="text-end">
            <form th:action="@{/perfiles/{p}/enfermedades/{id}/eliminar(p=${perfil.id},id=${e.id})}" method="post" data-confirm="¿Eliminar este registro?">
              <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(enfermedades)}"><td colspan="5" class="text-muted text-center py-4">Aún no hay enfermedades registradas.</td></tr>
      </tbody>
    </table></div>
  </div></div>

  <div class="card mq-card"><div class="card-body">
    <h2 class="h6 text-uppercase text-muted">Agregar enfermedad</h2>
    <form th:action="@{/perfiles/{p}/enfermedades(p=${perfil.id})}" th:object="${nueva}" method="post" class="row g-2">
      <div class="col-md-4"><input class="form-control" th:field="*{nombre}" placeholder="Diabetes tipo 2" required></div>
      <div class="col-md-3"><input type="date" class="form-control" th:field="*{desde}"></div>
      <div class="col-md-5"><input class="form-control" th:field="*{notas}" placeholder="Notas"></div>
      <div class="col-md-8 form-check ms-2 mt-2"><input type="checkbox" class="form-check-input" th:field="*{cronica}"><label class="form-check-label">Es una enfermedad crónica</label></div>
      <div class="col-md-3 d-grid ms-auto"><button class="btn btn-mq">Guardar</button></div>
    </form>
  </div></div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
