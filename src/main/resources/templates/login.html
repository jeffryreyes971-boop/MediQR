<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - MediQR</title>
    
    <!-- Meta tags de CSRF por seguridad -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>

    <!-- Bootstrap 5 CSS & Iconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Hoja de estilos personalizada de MediQR -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>
<body class="mq-auth">

<main class="container d-flex justify-content-center align-items-center min-vh-100 py-4">
  <div class="mq-auth-card">
    
    <!-- Encabezado con Logo centrado -->
    <div class="text-center mb-4">
      <div class="mq-logo mb-2">
        <img th:src="@{/img/logo-mediqr.png}" alt="Logo MediQR">
      </div>
      <p class="text-muted small mb-0">Tus datos médicos, siempre a la mano</p>
    </div>

    <!-- Alertas de estado (Spring Security) -->
    <div class="alert alert-danger py-2 small" th:if="${param.error}">Correo o contraseña incorrectos.</div>
    <div class="alert alert-success py-2 small" th:if="${param.registrado}">Cuenta creada. Ya puedes iniciar sesión.</div>
    <div class="alert alert-info py-2 small" th:if="${param.logout}">Cerraste sesión correctamente.</div>

    <!-- Formulario de autenticación -->
    <form th:action="@{/login}" method="post">
      
      <!-- Campo Correo -->
      <div class="mb-3">
        <label class="form-label small fw-semibold">Correo electrónico</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0">
            <i class="bi bi-envelope text-muted"></i>
          </span>
          <input name="correo" type="email" class="form-control bg-light border-start-0" placeholder="tucorreo@ejemplo.com" required autofocus>
        </div>
      </div>
      
      <!-- Campo Contraseña -->
      <div class="mb-4">
        <label class="form-label small fw-semibold">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text bg-light border-end-0">
            <i class="bi bi-lock text-muted"></i>
          </span>
          <input name="password" type="password" class="form-control bg-light border-start-0" placeholder="••••••••" required>
        </div>
      </div>
      
      <!-- Botón de Inicio de Sesión -->
      <button type="submit" class="btn btn-mq w-100 py-2.5 rounded-3 fw-semibold">Entrar</button>
    </form>
    
    <!-- Enlace a Registro -->
    <p class="text-center small mt-4 mb-0">
      ¿No tienes cuenta? <a th:href="@{/registro}" class="fw-bold text-decoration-none">Regístrate</a>
    </p>

  </div>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
