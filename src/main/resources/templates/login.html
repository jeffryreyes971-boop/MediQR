<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Iniciar sesión')}"></head>
<body class="mq-auth">
<main class="container">
  <div class="mq-auth-card mx-auto">
    <div class="text-center mb-4">
      <div class="mq-logo"><i class="bi bi-heart-pulse-fill"></i></div>
      <h1 class="h3 fw-bold mb-0">Medi<span class="text-info">QR</span></h1>
      <p class="text-muted small">Tu historial médico, siempre contigo</p>
    </div>

    <div class="alert alert-danger" th:if="${param.error}">Correo o contraseña incorrectos.</div>
    <div class="alert alert-success" th:if="${param.registrado}">Cuenta creada. Ya puedes iniciar sesión.</div>
    <div class="alert alert-info" th:if="${param.logout}">Cerraste sesión correctamente.</div>

    <!-- Spring Security espera los campos "correo" y "password" -->
    <form th:action="@{/login}" method="post">
      <label class="form-label">Correo</label>
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="bi bi-envelope"></i></span>
        <input name="correo" type="email" class="form-control" placeholder="tucorreo@ejemplo.com" required autofocus>
      </div>
      <label class="form-label">Contraseña</label>
      <div class="input-group mb-4">
        <span class="input-group-text"><i class="bi bi-lock"></i></span>
        <input name="password" type="password" class="form-control" required>
      </div>
      <button class="btn btn-mq w-100 py-2">Entrar</button>
    </form>
    <p class="text-center small mt-4 mb-0">¿No tienes cuenta? <a th:href="@{/registro}">Regístrate</a></p>
  </div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
