<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Recordatorios')}"></head>
<body>
<nav th:replace="~{fragments/layout :: nav}"></nav>
<main class="container py-4">
  <div th:replace="~{fragments/layout :: tabs(${perfil}, 'recordatorios')}"></div>

  <div class="alert alert-success" th:if="${ok}" th:text="${ok}"></div>
  <div class="alert alert-danger" th:if="${error}" th:text="${error}"></div>

  <div class="card mq-card mb-4"><div class="card-body">
    <h2 class="h5 mb-1"><i class="bi bi-bell text-warning"></i> Recordatorios</h2>
    <p class="small text-muted">Vacunas, controles y medicamentos. Se envían al correo de tu cuenta cuando llega la fecha.</p>
    <div class="table-responsive">
    <table class="table align-middle mb-0">
      <thead><tr><th>Recordatorio</th><th>Tipo</th><th>Fecha y hora</th><th>Estado</th><th></th></tr></thead>
      <tbody>
        <tr th:each="r : ${recordatorios}" th:classappend="${r.enviado} ? 'text-muted'">
          <td class="fw-semibold" th:text="${r.titulo}"></td>
          <td><span class="badge text-bg-light" th:text="${r.tipo}"></span></td>
          <td th:text="${#temporals.format(r.fechaHora, 'dd/MM/yyyy HH:mm')}"></td>
          <td><span class="badge" th:classappend="${r.enviado} ? 'text-bg-secondary' : 'text-bg-warning'"
                    th:text="${r.enviado} ? 'Enviado' : 'Pendiente'"></span></td>
          <td class="text-end">
            <form th:action="@{/perfiles/{p}/recordatorios/{id}/eliminar(p=${perfil.id},id=${r.id})}" method="post" data-confirm="¿Eliminar este recordatorio?">
              <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
            </form>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(recordatorios)}"><td colspan="5" class="text-muted text-center py-4">Aún no hay recordatorios.</td></tr>
      </tbody>
    </table></div>
  </div></div>

  <div class="card mq-card"><div class="card-body">
    <h2 class="h6 text-uppercase text-muted">Nuevo recordatorio</h2>
    <form th:action="@{/perfiles/{p}/recordatorios(p=${perfil.id})}" method="post" class="row g-2">
      <div class="col-md-4"><input name="titulo" class="form-control" placeholder="Refuerzo de influenza" maxlength="150" required></div>
      <div class="col-md-3"><select name="tipo" class="form-select">
        <option value="VACUNA">Vacuna</option><option value="CONTROL">Control médico</option><option value="MEDICAMENTO">Medicamento</option></select></div>
      <div class="col-md-3"><input name="fechaHora" type="datetime-local" class="form-control" required></div>
      <div class="col-md-2 d-grid"><button class="btn btn-mq">Guardar</button></div>
    </form>
  </div></div>
</main>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
