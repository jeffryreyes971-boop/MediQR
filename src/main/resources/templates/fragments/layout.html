<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ===== HEAD común: se usa en todas las pantallas ===== -->
<head th:fragment="head(titulo)">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="_csrf" th:if="${_csrf}" th:content="${_csrf.token}">
  <meta name="_csrf_header" th:if="${_csrf}" th:content="${_csrf.headerName}">
  <title th:text="${titulo} + ' · MediQR'">MediQR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/mediqr.css}">
</head>

<body>
<!-- ===== BARRA SUPERIOR ===== -->
<nav th:fragment="nav" class="navbar navbar-dark mq-nav">
  <div class="container">
    <a class="navbar-brand fw-bold" th:href="@{/dashboard}">
      <i class="bi bi-heart-pulse-fill"></i> Medi<span>QR</span>
    </a>
    <div class="ms-auto d-flex align-items-center gap-3">
      <span class="text-white-50 small d-none d-sm-inline">
        <i class="bi bi-person-circle"></i> <span sec:authentication="name"></span>
      </span>
      <form th:action="@{/logout}" method="post" class="m-0">
        <button class="btn btn-sm btn-outline-light"><i class="bi bi-box-arrow-right"></i> Salir</button>
      </form>
    </div>
  </div>
</nav>

<!-- ===== PESTAÑAS DEL PERFIL (se usan dentro de cada perfil) ===== -->
<div th:fragment="tabs(perfil, activa)" class="mq-tabs-wrap">
  <div class="d-flex align-items-center gap-3 mb-3">
    <div class="mq-avatar" th:text="${#strings.toUpperCase(#strings.substring(perfil.nombre,0,1))}">A</div>
    <div>
      <h1 class="h4 mb-0" th:text="${perfil.nombre}">Nombre</h1>
      <span class="badge text-bg-light" th:text="${perfil.parentesco}">TITULAR</span>
      <span class="badge mq-sangre" th:if="${perfil.tipoSangre}" th:text="${perfil.tipoSangre}">O+</span>
    </div>
    <a class="btn btn-sm btn-outline-secondary ms-auto" th:href="@{/perfiles/{id}/editar(id=${perfil.id})}">
      <i class="bi bi-pencil"></i> Editar
    </a>
  </div>
  <ul class="nav nav-pills mq-tabs mb-4 flex-nowrap overflow-auto">
    <li class="nav-item"><a class="nav-link" th:classappend="${activa=='inicio'} ? 'active'"
        th:href="@{/perfiles/{id}(id=${perfil.id})}"><i class="bi bi-house"></i> Resumen</a></li>
    <li class="nav-item"><a class="nav-link" th:classappend="${activa=='alergias'} ? 'active'"
        th:href="@{/perfiles/{id}/alergias(id=${perfil.id})}"><i class="bi bi-exclamation-triangle"></i> Alergias</a></li>
    <li class="nav-item"><a class="nav-link" th:classappend="${activa=='recetas'} ? 'active'"
        th:href="@{/perfiles/{id}/recetas(id=${perfil.id})}"><i class="bi bi-capsule"></i> Recetas</a></li>
    <li class="nav-item"><a class="nav-link" th:classappend="${activa=='vacunas'} ? 'active'"
        th:href="@{/perfiles/{id}/vacunas(id=${perfil.id})}"><i class="bi bi-shield-plus"></i> Vacunas</a></li>
    <li class="nav-item"><a class="nav-link" th:classappend="${activa=='enfermedades'} ? 'active'"
        th:href="@{/perfiles/{id}/enfermedades(id=${perfil.id})}"><i class="bi bi-activity"></i> Enfermedades</a></li>
    <li class="nav-item"><a class="nav-link" th:classappend="${activa=='examenes'} ? 'active'"
        th:href="@{/perfiles/{id}/examenes(id=${perfil.id})}"><i class="bi bi-clipboard2-pulse"></i> Exámenes</a></li>
    <li class="nav-item"><a class="nav-link" th:classappend="${activa=='documentos'} ? 'active'"
        th:href="@{/perfiles/{id}/documentos(id=${perfil.id})}"><i class="bi bi-file-earmark-lock"></i> Documentos</a></li>
    <li class="nav-item"><a class="nav-link" th:classappend="${activa=='contactos'} ? 'active'"
        th:href="@{/perfiles/{id}/contactos(id=${perfil.id})}"><i class="bi bi-telephone"></i> Contactos</a></li>
    <li class="nav-item"><a class="nav-link" th:classappend="${activa=='recordatorios'} ? 'active'"
        th:href="@{/perfiles/{id}/recordatorios(id=${perfil.id})}"><i class="bi bi-bell"></i> Recordatorios</a></li>
    <li class="nav-item"><a class="nav-link" th:classappend="${activa=='accesos'} ? 'active'"
        th:href="@{/perfiles/{id}/accesos(id=${perfil.id})}"><i class="bi bi-eye"></i> Accesos</a></li>
    <li class="nav-item"><a class="nav-link" th:classappend="${activa=='qr'} ? 'active'"
        th:href="@{/perfiles/{id}/qr(id=${perfil.id})}"><i class="bi bi-qr-code"></i> QR</a></li>
  </ul>
</div>

<!-- ===== SCRIPTS comunes (al final de cada página) ===== -->
<th:block th:fragment="scripts">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script th:src="@{/js/app.js}"></script>
</th:block>
</body>
</html>
