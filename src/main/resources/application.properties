spring.application.name=mediqr

# =====================================================
#  1) BASE DE DATOS (XAMPP: usuario root sin contrasena)
# =====================================================
spring.datasource.url=jdbc:mysql://localhost:3306/mediqr_db?useSSL=false&serverTimezone=America/El_Salvador&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=futbol503
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Hibernate Dialect ken DDL auto para iti Aiven MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# Subida de archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# =====================================================
#  2) MEDIQR
# =====================================================
mediqr.base-url=${MEDIQR_BASE_URL:http://localhost:8080}
mediqr.qr.minutos-vigencia=10
mediqr.almacen=./almacen

# Clave AES-256 SOLO PARA DESARROLLO
mediqr.cifrado.clave-base64=${MEDIQR_CLAVE_AES:HoyFVroqKepD5aWYXub2WMKJHUodzmnmNe4q59nVk5I=}

# =====================================================
#  3) IA (opcional)
# =====================================================
anthropic.api.key=${ANTHROPIC_API_KEY:}
anthropic.model=claude-haiku-5-5

# =====================================================
#  4) CORREO para recordatorios (opcional)
# =====================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
